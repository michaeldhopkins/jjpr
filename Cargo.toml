[package]
name = "jjpr"
version = "0.42.0"
edition = "2024"
rust-version = "1.91"
description = "Manage stacked pull requests in Jujutsu repositories"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michaeldhopkins/jjpr"
keywords = ["jujutsu", "jj", "stacked-prs", "github", "gitlab"]
categories = ["development-tools"]

[[bin]]
name = "jjpr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dialoguer = "0.11"
toml = "0.8"
percent-encoding = "2"
ureq = { version = "3", features = ["json"] }
vcs-runner = { version = "0.19.0", default-features = false }
ctrlc = "3"
libc = "0.2.183"

[dev-dependencies]
tempfile = "3"
proptest = "1.11"
assert_cmd = "2"
predicates = "3"
insta = "1"
clap_complete = "4"
clap_mangen = "0.2"
# openpty, for the TTY-countdown integration test (tests/tty_watch.rs)
libc = "0.2.183"
# syn + proc-macro2: tests/file_length.rs parses the source rather than scanning its text, so a
# test module between functions or a `}` in a string cannot fool the count. `span-locations`
# gives it real line numbers.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`; a misspelt cfg would otherwise never apply.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
# Enforce enums over boolean state flags
struct_excessive_bools = "deny"
fn_params_excessive_bools = "deny"

# Catch boolean patterns that could benefit from enums
match_bool = "warn"
bool_to_int_with_if = "warn"

# Complexity limits to catch functions that need refactoring
cognitive_complexity = "warn"
too_many_lines = "warn"

# Tightened to deny
collapsible_if = "deny"
too_many_arguments = "deny"

# Encourage idiomatic patterns
needless_range_loop = "deny"
extend_with_drain = "deny"

# Baseline lints: tests/lint_suppressions.rs fails when one goes missing or is weakened
unwrap_used = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/jjpr-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "jjpr"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/jjpr-{ target }.zip"
pkg-fmt = "zip"

[profile.dist]
inherits = "release"
lto = "thin"
