name: Mutants

# Mutation testing of the code a change actually touches.
#
# `cargo mutants` generates plausible bugs and reports the ones the tests fail to
# notice. A full-tree run on jjpr is ~1246 mutants at roughly 88s each — hours, and
# build-bound rather than test-bound, so it belongs on a schedule and across
# machines, not here. `--in-diff` restricts it to mutants overlapping the changed
# regions, which is minutes and puts a finding in the review conversation where it
# is cheapest to act on.
#
# General method is in the `rust-mutation-testing` skill; jjpr's specifics are in
# AGENTS.md.
on:
  pull_request:
    # Skip doc-only changes; mutants can only come from source anyway.
    paths:
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
      - "Cargo.*"
      - "src/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
      - "Cargo.*"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  in-diff:
    name: Mutants in changed code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Need history to diff against the base ref (PR) or the previous
          # commit (push). A shallow clone has neither.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary; `cargo install` would rebuild it on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # jj MUST be present or this job reports nonsense.
      #
      # 41 `#[test]` functions across 10 test files gate on `jj_available()` and
      # silently return when the binary is missing — a skipped test reports as
      # passed, so every mutant covered only by those tests would come back
      # MISSED. That is the "mutation testing measures the tests it can run"
      # trap, and here it is caused by an absent binary rather than an env gate,
      # which makes it invisible rather than merely quiet.
      #
      # 31 is the number that matters to THIS job: the other 10 also sit behind
      # `JJPR_E2E`, which no CI job sets, so they skip whatever we do here and
      # their coverage is unavailable to mutation testing either way.
      #
      # Pinned rather than :latest for two reasons: a jj release must not change
      # what this job reports overnight, and this is the version the suite was
      # actually verified against locally. These tests have never run on Linux
      # (see below), so this job should not also be the first to try a jj version
      # nobody has run them against. jjpr requires 0.36+; bump deliberately, and
      # expect the bump itself to be the interesting change.
      - name: Install jj
        env:
          JJ_VERSION: v0.39.0
        run: |
          set -euo pipefail
          url="https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          # Extract the whole archive and install the one file, rather than
          # naming a member: the archive stores paths as `./jj`, and whether a
          # bare `jj` matches that differs between GNU tar (CI) and bsdtar
          # (macOS, where this was written). Into ~/.local/bin, not
          # /usr/local/bin, so no sudo is needed.
          tmp="$(mktemp -d)"
          curl -fsSL "$url" | tar xz -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          install -m755 "$tmp/jj" "$HOME/.local/bin/jj"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jj" --version

      # jjpr lands work by pushing to main as well as by PR, so both need a diff.
      # A PR diffs against its base; a push diffs against the commit it replaced.
      # `github.event.before` is all-zeros for a newly created branch, in which
      # case fall back to the first parent.
      - name: Compute diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD~1"
            else
              base="$before"
            fi
          fi
          echo "Diffing against $base"
          # Force standard a/ b/ prefixes. `diff.mnemonicPrefix` (common in
          # personal git configs, and set in this project's author's) emits
          # `i/` and `w/` instead, which cargo-mutants does not recognise: it
          # matches no files, logs "No mutants to filter" and EXITS 0. That is
          # the worst failure mode for a gate — a silent pass. Measured locally:
          # a one-line edit selected 3 mutants with a/b prefixes and 0 with i/w.
          git -c diff.mnemonicPrefix=false -c diff.noprefix=false \
              diff "$base".. > mutants.diff
          wc -l mutants.diff

          # Belt and braces: if the diff is non-empty it must carry the prefixes
          # cargo-mutants can read. Without this the above regressing would look
          # like "nothing to test" rather than a broken harness.
          if [ -s mutants.diff ] && ! grep -q '^diff --git a/' mutants.diff; then
            echo "::error::diff lacks a/ b/ prefixes — cargo-mutants would silently match nothing"
            head -3 mutants.diff
            exit 1
          fi

      # A diff touching only tests or docs yields no mutants — cargo-mutants
      # matches the diff against the code under test, not the test code
      # (verified: a test-only diff selects 0).
      #
      # The early exits are for the MESSAGE, not the exit code: cargo-mutants
      # already exits 0 on an empty selection with "No mutants to filter". Without
      # them the job is a silent green and nobody can tell whether it ran.
      - name: Mutants
        id: mutants
        run: |
          set -euo pipefail

          # Every exit path records WHY here, because `Summarise` runs on
          # `if: always()` and has no other way to tell "tested nothing" from
          # "tested everything and found nothing". Without it, an early exit
          # produced a summary reading `missed: 0, caught: 0` — indistinguishable
          # from a clean pass, which is the exact misreading this job exists to
          # prevent.
          echo "ran" > mutants-status.txt

          if [ ! -s mutants.diff ]; then
            echo "empty" > mutants-status.txt
            echo "::notice::empty diff — nothing to mutate"
            exit 0
          fi
          selected=$(cargo mutants --list --in-diff mutants.diff | wc -l)
          echo "$selected" > mutants-selected.txt
          echo "Selected $selected mutants in changed regions"
          if [ "$selected" -eq 0 ]; then
            echo "none" > mutants-status.txt
            echo "::notice::no mutants overlap the changed regions (test- or doc-only change)"
            exit 0
          fi

          # `--in-diff` assumes the diff is a FOCUSED change. A sweep breaks that
          # assumption completely: the 0.38.0 reformat touched 45 files, and
          # because rustfmt moved lines inside nearly every function, selection
          # went from 12 mutants to 236 — a 20x jump from a commit that changed
          # no behaviour at all. At the ~20s/mutant this job actually measures,
          # that is ~75 minutes; it ran 138 of them and was cancelled by the
          # 45-minute job timeout.
          #
          # Skipping loudly beats both alternatives. Raising the timeout makes a
          # slow gate slower without bounding it, and sampling with `--shard`
          # would report a partial run as a pass — a reviewer cannot tell 1/3 of
          # the mutants from all of them by looking at a green tick.
          #
          # Exit 0 because a broad diff is not a test failure, but emit a WARNING
          # rather than a notice: this is coverage the gate did not provide, and
          # per AGENTS.md a bounded run must say what it dropped.
          MAX_SELECTED=100
          if [ "$selected" -gt "$MAX_SELECTED" ]; then
            echo "skipped" > mutants-status.txt
            # One line, no backslash continuations: a `\`-continued string keeps
            # the next line's indentation, so the annotation renders with a run
            # of spaces in the middle of the sentence.
            echo "::warning::Mutants skipped: $selected selected, over the limit of $MAX_SELECTED. A diff this broad is a sweep rather than a changed-code gate and would exceed the job timeout. Nothing was mutation-tested for this push."
            exit 0
          fi
          # Exit codes worth knowing when this goes red (see the book):
          #   2  a mutant was MISSED — the finding; write a test or justify it
          #   3  a mutant TIMED OUT — usually an injected infinite loop, which is
          #      also a real result: the code is only safe because of the guard
          #      that was mutated
          #   5  the diff's new side does not match the tree — a harness bug in
          #      the "Compute diff" step above, NOT a problem with the code
          #   6  the diff is malformed — likewise a harness bug
          # 2 and 3 are about jjpr; 5 and 6 are about this workflow.
          # No --timeout on purpose. cargo-mutants derives one from the measured
          # baseline (89s for jjpr's full suite locally) and therefore ADAPTS to a
          # slower CI runner; a hardcoded value does not.
          #
          # Correction, measured 2026-08-03: this comment used to claim a job
          # timeout could skip the `if: always()` steps below and lose the report.
          # It does not. The 0.38.0 run was cancelled at exactly 45 minutes and
          # both Summarise and Archive still ran and succeeded, so a timed-out run
          # does report its partial results. The reason to avoid hitting the
          # timeout is the wasted 45 minutes, not a lost report.
          cargo mutants --no-shuffle -vV --in-diff mutants.diff

      # Put the finding in the run summary so a reviewer sees it without
      # downloading an artifact. `missed.txt` is the actual deliverable.
      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          status="$(cat mutants-status.txt 2>/dev/null || echo unknown)"
          selected="$(cat mutants-selected.txt 2>/dev/null || echo '?')"
          {
            echo '## Mutants in changed code'
            echo
            echo "_step outcome: ${{ steps.mutants.outcome }}_"
            echo
            # Branch on WHY the step ended. Printing the counts unconditionally
            # renders `missed: 0, caught: 0` for a run that tested nothing, which
            # is indistinguishable from a clean pass — the misreading this whole
            # job exists to prevent, reproduced in its own report.
            case "$status" in
              empty)
                echo 'No diff to analyse. Nothing was mutation-tested.'
                ;;
              none)
                echo 'No mutants overlap the changed regions — a test-only or'
                echo 'docs-only change. Nothing was mutation-tested, and that is'
                echo 'expected: cargo-mutants does not mutate test code.'
                ;;
              skipped)
                echo "**Skipped: $selected mutants selected, over the limit.**"
                echo
                echo 'This is what a reformat or mass refactor looks like — the diff'
                echo 'touches many functions without changing behaviour, so `--in-diff`'
                echo 'selects a large share of the tree and cannot finish in the job'
                echo 'budget. **Nothing was mutation-tested for this push.**'
                echo
                echo 'To cover it deliberately, shard a manual run:'
                echo '`cargo mutants --in-diff <diff> --shard 0/4`'
                ;;
              unknown)
                # No status file: the Mutants step never reached its first line,
                # so an earlier step (Compute diff, the jj install) failed. Say so
                # instead of falling through to the counts, which would be zeros
                # and would read as a clean pass for a job that never started.
                echo 'The mutants step did not run — an earlier step failed.'
                echo 'Check "Compute diff": a malformed or empty diff, or a base'
                echo 'ref that does not resolve, stops the job before any mutant'
                echo 'is generated. **Nothing was mutation-tested.**'
                ;;
              *)
                if [ ! -d mutants.out ]; then
                  # `ran` was recorded but no results exist, so cargo-mutants died
                  # partway (exit 5/6 are harness bugs, not findings). Zeros here
                  # would be a lie in the most dangerous direction.
                  echo 'cargo-mutants started but produced no results directory —'
                  echo 'it failed before reporting. See the step log; exit 5 and 6'
                  echo 'are harness bugs in this workflow, not findings about jjpr.'
                  echo '**Treat this as no coverage, not as a pass.**'
                  exit 0
                fi
                for kind in missed caught unviable timeout; do
                  f="mutants.out/$kind.txt"
                  n=0
                  [ -f "$f" ] && n=$(wc -l < "$f" | tr -d ' ')
                  echo "- **$kind**: $n"
                done
                if [ -s mutants.out/missed.txt ]; then
                  echo
                  echo '### Missed — a bug was inserted here and no test noticed'
                  echo
                  echo '```'
                  cat mutants.out/missed.txt
                  echo '```'
                  echo
                  echo 'Three legitimate responses: write a test that fails on it;'
                  echo 'judge it an *equivalent* mutant that cannot change behaviour;'
                  echo 'or exclude the code with a comment saying why.'
                fi
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive mutants.out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-in-diff
          path: mutants.out
          if-no-files-found: ignore
