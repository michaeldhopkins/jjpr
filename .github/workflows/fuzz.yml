name: Fuzz

# The mutation half of the fuzzing program: a short burst on every push to main.
# `fuzz-replay.yml` is the gate; this is not, and nothing depends on it, so a random
# find turns this workflow red rather than the push. Runs on nightly Rust (cargo-fuzz
# needs -Zsanitizer); the fuzz crate is a standalone workspace, so this never touches
# the stable CI in ci.yml.
#
# Replaced a 07:00 UTC nightly (12 shards x 15 min) on 2026-09-26. The nightly's last
# real find was 2026-08-03 and it found nothing in the seven weeks after; the finds all
# came in a target's first days. A burst per push follows the code instead: new code is
# fuzzed the day it lands. AGENTS.md has the history.
#
# Shape: build every target once, then one job per target that restores the canonical
# corpus, fuzzes ~180s in a single process, merges its finds back and saves the result
# under a fresh key. Coverage then reports what the merged corpus reaches.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Fuzz duration in seconds, per target (default 180). Keep under ~2400: the job times out at 60 min."
        default: "180"

# Never cancel a running burst: a cancelled job swallows a failing crash check. GitHub
# keeps one pending run per group, so pushes landing mid-burst collapse into the newest,
# which fuzzes the latest code anyway.
concurrency:
  group: fuzz-burst
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRIPLE: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Build fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # nightly + rust-src: cargo-fuzz builds std with the sanitizer instrumented.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # --target is pinned to the gnu host triple: cargo-fuzz ships as a prebuilt musl
      # static binary and otherwise defaults the fuzz build to its own musl triple,
      # whose static libc cannot carry AddressSanitizer ("sanitizer is incompatible
      # with statically linked libc").
      - name: Build all targets
        run: cargo +nightly fuzz build --target "$TRIPLE"

      # `cargo fuzz run` and `-merge=1` would each rebuild. The cargo-fuzz output is a
      # standalone libFuzzer executable, so the per-target jobs exec it directly with
      # the flags cargo-fuzz would have passed.
      - name: Upload fuzz binaries
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-binaries
          path: |
            fuzz/target/${{ env.TRIPLE }}/release/jj_output
            fuzz/target/${{ env.TRIPLE }}/release/remote_url
            fuzz/target/${{ env.TRIPLE }}/release/comment_roundtrip
            fuzz/target/${{ env.TRIPLE }}/release/forge_payload
            fuzz/target/${{ env.TRIPLE }}/release/config_load
            fuzz/target/${{ env.TRIPLE }}/release/graph_invariants
          if-no-files-found: error

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # one target finding a crash must not cancel the others
      matrix:
        target:
          - jj_output
          - remote_url
          - comment_roundtrip
          - forge_payload
          - config_load
          - graph_invariants
    steps:
      - uses: actions/checkout@v5

      - name: Download fuzz binaries
        uses: actions/download-artifact@v4
        with:
          name: fuzz-binaries
          path: bin

      # Artifact upload does not preserve the executable bit.
      - name: Make executable
        run: chmod +x bin/*

      # The same key scheme fuzz-replay.yml restores: a prefix match on
      # `fuzz-corpus-<target>-` pulls the newest entry this workflow saved.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # One process, not fork mode: fork mode reloads the whole corpus in every child,
      # and on a short budget the loading is most of the run. A single process stops at
      # its first crash, which for a burst is the right outcome.
      #
      # libFuzzer writes new units only to the FIRST corpus dir, so `new/` holds exactly
      # what this run discovered and the merge below reads the restored corpus once.
      - name: Fuzz
        run: |
          set -euo pipefail
          T=${{ matrix.target }}
          mkdir -p fuzz/corpus/$T fuzz/corpus/new fuzz/artifacts/$T
          DICT=""
          [ -f "fuzz/dict/$T.dict" ] && DICT="-dict=fuzz/dict/$T.dict"
          ./bin/$T \
            $DICT \
            -max_total_time=${{ github.event.inputs.max_total_time || '180' }} \
            -timeout=25 \
            -rss_limit_mb=4096 \
            -print_final_stats=1 \
            -artifact_prefix=fuzz/artifacts/$T/ \
            fuzz/corpus/new fuzz/corpus/$T

      # Runs after a crash too: whatever the burst found before it stopped is still
      # coverage worth keeping. The crashing input is in fuzz/artifacts, not a corpus
      # dir, so it is not merged.
      #
      # `-merge=1 DST SRC...` unions and minimizes in one step: starting from an empty
      # DST over [restored corpus + committed seeds, this run's finds] yields exactly
      # the minimized union.
      - name: Merge
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          T=${{ matrix.target }}
          mkdir -p minimized
          echo "Restored corpus + seeds: $(find fuzz/corpus/$T -type f | wc -l) inputs"
          echo "New this run: $(find fuzz/corpus/new -type f | wc -l)"
          ./bin/$T -merge=1 minimized fuzz/corpus/$T fuzz/corpus/new
          rm -rf fuzz/corpus/$T
          mv minimized fuzz/corpus/$T
          echo "Merged corpus: $(find fuzz/corpus/$T -type f | wc -l) inputs"

      # A unique (always-miss) key, so the next restore's prefix match pulls this one.
      - name: Save corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

      # slow-unit is uploaded for triage but is not fatal: it is contention-sensitive.
      - name: Fail on crashes
        if: always()
        run: |
          hits=$(find fuzz/artifacts -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' \) 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::fuzzing saved crash/timeout artifacts for ${{ matrix.target }}"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "no crash/timeout/oom artifacts"

  # What the crash signal cannot tell you: which parts of jjpr the corpus never reaches.
  # Informational only; it is the input to deciding where the next target or seed goes.
  # About 2 minutes per target, in parallel, after the burst.
  coverage:
    name: Coverage ${{ matrix.target }}
    needs: [build, fuzz]
    # Runs after a red burst too (the merged corpus was still saved), but not after a
    # failed build, when there is nothing new to measure.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [jj_output, graph_invariants, remote_url]
    steps:
      - uses: actions/checkout@v5

      # llvm-tools-preview is REQUIRED: without it `cargo fuzz coverage` replays the
      # corpus fine and then dies at "Merging raw coverage data", because llvm-profdata
      # is absent from the nightly sysroot.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Restore merged corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # A separate build: coverage instrumentation differs from the sanitizer build, so
      # this one cannot reuse the shared binary.
      - name: Generate coverage data
        run: cargo +nightly fuzz coverage ${{ matrix.target }} --target "$TRIPLE"

      # Don't hardcode cargo-fuzz's layout — it differs with/without --target and has
      # moved between releases. Search both target roots, then PROBE each candidate and
      # keep the first llvm-cov accepts: the probe, not the path, is the real check, and
      # it also rejects a stale non-instrumented binary from an earlier build.
      - name: Render report
        run: |
          set -euo pipefail
          T=${{ matrix.target }}
          LLVM_COV="$(rustc +nightly --print sysroot)/lib/rustlib/$TRIPLE/bin/llvm-cov"
          PROF=fuzz/coverage/$T/coverage.profdata
          BIN=""
          for cand in $(find target fuzz/target -path '*coverage*release*' -name "$T" -type f 2>/dev/null); do
            if "$LLVM_COV" report "$cand" -instr-profile="$PROF" >/dev/null 2>&1; then
              BIN="$cand"; break
            fi
          done
          if [ -z "$BIN" ]; then
            echo "::error::no INSTRUMENTED $T binary matched $PROF (cargo-fuzz layout changed?)"
            find target fuzz/target -name "$T" -type f 2>/dev/null || true
            exit 1
          fi
          # Report jjpr's OWN authored source only — not deps, std, the fuzz shim, or
          # build-script-generated files.
          IGNORE='(/\.cargo/|/rustc/|/fuzz/|/out/)'
          {
            echo "## Fuzz coverage (\`$T\` target)"
            echo
            echo "Corpus: $(find fuzz/corpus/$T -type f | wc -l) inputs"
            echo
            echo '```'
            "$LLVM_COV" report "$BIN" -instr-profile="$PROF" -ignore-filename-regex="$IGNORE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          "$LLVM_COV" show "$BIN" -instr-profile="$PROF" -ignore-filename-regex="$IGNORE" \
            -format=html -output-dir=coverage-html

      - name: Upload HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage-html-${{ matrix.target }}
          path: coverage-html
          if-no-files-found: warn
